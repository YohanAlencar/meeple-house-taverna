{% extends 'taverna/base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card bg-dark text-light border-warning p-4 shadow">
        <h2 class="text-warning text-center fw-bold mb-4">ALTERAR PALAVRA-PASSE</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2">
                Alterar a minha palavra-passe
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'editar_perfil' %}" class="text-decoration-none text-muted small">
                Voltar ao meu perfil
            </a>
        </div>
    </div>
</div>

<style>
    .card input {
        background-color: #2b2b2b !important;
        color: #ffffff !important;
        border: 1px solid #444 !important;
        padding: 10px;
        width: 100%;
        border-radius: 5px;
    }
    .card .helptext, .card ul {
        font-size: 0.8rem;
        color: #adb5bd;
    }
</style>
{% endblock %}
