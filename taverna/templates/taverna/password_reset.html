{% extends 'taverna/base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card bg-dark text-light border-warning p-4 shadow">
        <h2 class="fw-bold mb-3 text-warning text-center">RECUPERAR SENHA</h2>
        <p class="text-muted small text-center mb-4">Introduz o teu e-mail para receber as instruções.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold text-dark mt-2 py-2">Redefinir Senha</button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="text-warning text-decoration-none small">← Voltar ao Login</a>
        </div>
    </div>
</div>

<style>
    .card input, .card select, .card textarea {
        background-color: #2b2b2b !important;
        color: #ffffff !important;
        border: 1px solid #444 !important;
        padding: 8px 12px;
        width: 100%;
        border-radius: 5px;
    }
    .card input:focus, .card select:focus, .card textarea:focus {
        background-color: #333 !important;
        color: #fff !important;
        border-color: #ffc107 !important;
        box-shadow: none;
        outline: none;
    }
    .card ul, .card .helptext {
        color: #adb5bd !important;
        font-size: 0.85rem;
    }
</style>
{% endblock %}
