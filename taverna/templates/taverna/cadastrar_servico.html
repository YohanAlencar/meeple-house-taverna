{% extends 'taverna/base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <div class="card bg-dark text-light border-warning p-4 shadow">
        <h2 class="text-warning text-center mb-4">Cadastrar Novo Serviço / Jogo</h2>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input type="text" name="nome" class="form-control bg-secondary text-light border-0" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descrição:</label>
                <textarea name="descricao" rows="3" class="form-control bg-secondary text-light border-0"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Preço (R$):</label>
                    <input type="number" step="0.01" name="preco" class="form-control bg-secondary text-light border-0" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Estoque:</label>
                    <input type="number" name="estoque" value="10" class="form-control bg-secondary text-light border-0">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Categoria:</label>
                <select name="categoria" class="form-select bg-secondary text-light border-0" required>
                    <option value="">Selecione uma categoria...</option>
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}">{{ cat.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">URL da Foto:</label>
                <input type="url" name="foto" placeholder="https://..." class="form-control bg-secondary text-light border-0">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="ativo" id="ativo" class="form-check-input" checked>
                <label for="ativo" class="form-check-label">Serviço Ativo</label>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'gerenciar_servicos' %}" class="btn btn-outline-light">Cancelar</a>
                <button type="submit" class="btn btn-warning fw-bold">Cadastrar Serviço</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
