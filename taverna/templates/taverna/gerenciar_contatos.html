{% extends 'taverna/base.html' %}
{% block content %}
<h2 class="fw-bold mb-4">Mensagens Recebidas</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Mensagem</th>
            <th>Data</th>
        </tr>
    </thead>
    <tbody>
        {% for m in mensagens %}
        <tr>
            <td>{{ m.nome }}</td>
            <td>{{ m.email }}</td>
            <td>{{ m.mensagem }}</td>
            <td>{{ m.data_envio|date:"d/m/Y H:i" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="text-center text-muted">Nenhuma mensagem recebida.</td></tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Voltar ao Dashboard</a>
{% endblock %}
