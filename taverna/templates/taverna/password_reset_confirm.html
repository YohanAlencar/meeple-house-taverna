{% extends 'taverna/base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card bg-dark text-light border-warning p-4 shadow">
        <h2 class="text-warning text-center fw-bold mb-4">DEFINIR NOVA PALAVRA-PASSE</h2>

        {% if validlink %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2">
                    Guardar nova palavra-passe
                </button>
            </form>
        {% else %}
            <div class="alert alert-danger small">
                Esta ligação de redefinição de palavra-passe é inválida ou já expirou. Solicita uma nova recuperação.
            </div>
            <a href="{% url 'password_reset' %}" class="btn btn-warning w-100 fw-bold mt-2">
                Solicitar nova ligação
            </a>
        {% endif %}
    </div>
</div>

<style>
    .card input {
        background-color: #2b2b2b !important;
        color: #ffffff !important;
        border: 1px solid #444 !important;
        padding: 10px;
        width: 100%;
        border-radius: 5px;
    }
    .card .helptext, .card ul {
        font-size: 0.8rem;
        color: #adb5bd;
    }
</style>
{% endblock %}
