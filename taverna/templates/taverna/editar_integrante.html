{% extends 'taverna/base.html' %}
{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-lg bg-dark text-white border-secondary">
                <div class="text-center mb-4">
                    <span class="badge bg-warning text-dark px-3 py-1 mb-2">MODIFICAR REGISTO</span>
                    <h2 class="fw-bold" style="color: var(--gold-amber); font-family: 'Cinzel', serif;">Editar Integrante</h2>
                    <p class="text-muted small">Atualize as informações do membro da equipa no Supabase.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-warning small">Nome Completo</label>
                        <input type="text" name="nome" value="{{ integrante.nome }}" class="form-control bg-secondary text-white border-0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-warning small">Cargo</label>
                        <input type="text" name="cargo" value="{{ integrante.cargo }}" class="form-control bg-secondary text-white border-0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-warning small">Biografia</label>
                        <textarea name="biografia" class="form-control bg-secondary text-white border-0" rows="3" required>{{ integrante.biografia }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-warning small">URL da Foto</label>
                        <input type="text" name="foto_url" value="{{ integrante.foto_url }}" class="form-control bg-secondary text-white border-0" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning fw-bold text-dark">Salvar Alterações</button>
                        <a href="{% url 'gerenciar_equipe' %}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
