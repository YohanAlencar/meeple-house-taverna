{% extends 'taverna/base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card bg-dark text-light border-warning p-4 shadow text-center">
        <h2 class="text-warning fw-bold mb-3">E-mail Enviado</h2>
        <p class="text-muted mb-4">
            Enviámos um e-mail com as instruções necessárias para redefinir a sua senha. 
            Verifique a sua caixa de entrada (ou o terminal, caso esteja a testar em ambiente local).
        </p>
        <a href="{% url 'login' %}" class="btn btn-warning fw-bold py-2">Voltar ao Login</a>
    </div>
</div>
{% endblock %}
